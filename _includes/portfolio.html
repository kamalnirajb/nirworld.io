  <!-- PORTFOLIO -->
  <section id="portfolio" class="section section-dark">
    <div class="container">
      <h2 class="section-title">Selected <span class="accent">Portfolio</span></h2>
      <div class="portfolio-grid">

        {% for project in site.data.content.portfolio %}
        <div class="portfolio-card{% if project.featured %} featured{% endif %}">
          {% if project.featured %}<div class="portfolio-badge">Featured</div>{% endif %}
          <div class="portfolio-icon">{{ project.icon }}</div>
          <h3>{{ project.title }}</h3>
          <p class="portfolio-client">{{ project.client }}</p>
          <p>{{ project.description }}</p>
          <div class="portfolio-tags">
            {% for tag in project.tags %}<span>{{ tag }}</span>{% endfor %}
          </div>
        </div>
        {% endfor %}

      </div>
    </div>
  </section>
