  <!-- ABOUT -->
  <section id="about" class="section">
    <div class="container">
      <h2 class="section-title">About <span class="accent">Me</span></h2>
      <div class="about-grid">
        <div class="about-text">
          {% for p in site.data.content.about.paragraphs %}
          <p>{{ p }}</p>
          {% endfor %}
        </div>
        <div class="about-stats">
          {% for stat in site.data.content.about.stats %}
          <div class="stat-card" id="{{ stat.id }}">
            <span class="stat-num" data-target="{{ stat.target }}">0</span><span class="stat-plus">+</span>
            <span class="stat-label">{{ stat.label }}</span>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </section>
