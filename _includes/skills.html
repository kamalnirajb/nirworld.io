  <!-- SKILLS -->
  <section id="skills" class="section section-dark">
    <div class="container">
      <h2 class="section-title">Core <span class="accent">Skills</span></h2>
      <div class="skill-groups">

        {% for group in site.data.content.skills %}
        <div class="skill-group">
          <div class="skill-group-header">
            <span class="skill-icon">{{ group.icon }}</span>
            <h3>{{ group.title }}</h3>
          </div>
          <div class="skill-tags">
            {% for item in group.items %}
            <span class="tag {{ group.tag_class }}">{{ item }}</span>
            {% endfor %}
          </div>
        </div>
        {% endfor %}

      </div>
    </div>
  </section>
